name: overlordbot-local
services:
  srs:
    image: localhost/overlordbot-local-srs:dev
    build:
      context: .
      dockerfile: Dockerfile.srs
    entrypoint: ["/bin/sh", "-ec"]
    command: ['exec /usr/local/bin/srs-server --clientExportPath /tmp/clients.json --enableEAM true --eamBluePassword "$$SRS_EAM_PASSWORD" --coalitionSecurity true']
    environment:
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set a disposable SRS_EAM_PASSWORD}
    networks: [radio]
  tacview:
    image: localhost/overlordbot-local-runtime:dev
    build: .
    entrypoint: ["python", "scripts/replay_tacview.py"]
    command: ["--file", "fixtures/replay.acmi"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',42674),timeout=2).close()"]
      interval: 10s
    networks: [radio]
  brain:
    image: localhost/overlordbot-local-runtime:dev
    command: ["brain"]
    environment:
      TACVIEW_HOST: tacview
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8081'
      # Demo wind is explicitly configured, never fabricated from Tacview.
      ATC_WIND_FROM_DEG: ${ATC_WIND_FROM_DEG:-0}
      BRAIN_ROLES: ${BRAIN_ROLES:-awacs,atc}
      BOT_CALLSIGN: ${BOT_CALLSIGN:-Overlord}
      COALITION: ${COALITION:-2}
      SRS_FREQUENCY_HZ: ${SRS_FREQUENCY_HZ:-251000000}
      SRS_MODULATION: ${SRS_MODULATION:-0}
      JTAC_CALLSIGN: ${JTAC_CALLSIGN:-Axeman}
      JTAC_SRS_FREQUENCY_HZ: ${JTAC_SRS_FREQUENCY_HZ:-252000000}
      JTAC_SRS_MODULATION: ${JTAC_SRS_MODULATION:-0}
      DCS_BRIDGE_TOKEN: ${DCS_BRIDGE_TOKEN:-}
      DCS_STALE_SECONDS: ${DCS_STALE_SECONDS:-10}
      LLM_URL: ${LLM_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-3}
      AWACS_BULLSEYE: ${AWACS_BULLSEYE:-}
      AWACS_HOME_AIRFIELD: ${AWACS_HOME_AIRFIELD:-}
    depends_on: [tacview]
    networks: [radio]
  stt-worker:
    image: localhost/overlordbot-local-speech:dev
    build:
      context: .
      dockerfile: Dockerfile.speech
    command: ["stt-worker"]
    environment:
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8082'
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    networks: [radio]
  tts-worker:
    image: localhost/overlordbot-local-speech:dev
    command: ["tts-worker"]
    environment:
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8083'
      PIPER_THREADS: ${PIPER_THREADS:-4}
    networks: [radio]
  radio-gateway:
    image: localhost/overlordbot-local-runtime:dev
    command: ["radio-gateway"]
    environment:
      SRS_HOST: srs
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set SRS_EAM_PASSWORD}
      COALITION: ${COALITION:-2}
      SRS_FREQUENCY_HZ: ${SRS_FREQUENCY_HZ:-251000000}
      SRS_MODULATION: ${SRS_MODULATION:-0}
      BOT_CALLSIGN: ${BOT_CALLSIGN:-Overlord}
      STT_URLS: ${STT_URLS:-http://stt-worker:8082}
      TTS_URLS: ${TTS_URLS:-http://tts-worker:8083}
      BRAIN_URL: http://brain:8081
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8080'
    depends_on: [srs, brain, stt-worker, tts-worker]
    networks: [radio]
  jtac-gateway:
    profiles: [jtac]
    image: localhost/overlordbot-local-runtime:dev
    command: ["radio-gateway"]
    environment:
      SRS_HOST: srs
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set SRS_EAM_PASSWORD}
      COALITION: ${COALITION:-2}
      SRS_FREQUENCY_HZ: ${JTAC_SRS_FREQUENCY_HZ:-252000000}
      SRS_MODULATION: ${JTAC_SRS_MODULATION:-0}
      BOT_CALLSIGN: ${JTAC_CALLSIGN:-Axeman}
      STT_PROMPT: "Axeman, Viper one one, check in, nine line, readback, contact, mark, laser on, laser off, abort."
      STT_URLS: ${STT_URLS:-http://stt-worker:8082}
      TTS_URLS: ${TTS_URLS:-http://tts-worker:8083}
      BRAIN_URL: http://brain:8081
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8080'
    depends_on: [srs, brain, stt-worker, tts-worker]
    networks: [radio]
  carrier-gateways:
    profiles: [carrier]
    image: localhost/overlordbot-local-runtime:dev
    command: ["carrier-gateways"]
    environment:
      SRS_HOST: srs
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set SRS_EAM_PASSWORD}
      SRS_EAM_PASSWORDS: ${SRS_EAM_PASSWORDS:-}
      COALITION: ${COALITION:-2}
      STT_URLS: ${STT_URLS:-http://stt-worker:8082}
      TTS_URLS: ${TTS_URLS:-http://tts-worker:8083}
      BRAIN_URL: http://brain:8081
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8084'
      CARRIER_GATEWAY_POLL_SECONDS: ${CARRIER_GATEWAY_POLL_SECONDS:-1}
      CARRIER_GATEWAY_STALE_SECONDS: ${CARRIER_GATEWAY_STALE_SECONDS:-15}
    depends_on: [srs, brain, stt-worker, tts-worker]
    networks: [radio]
  airfield-gateways:
    profiles: [airfield]
    image: localhost/overlordbot-local-runtime:dev
    command: ["airfield-gateways"]
    environment:
      SRS_HOST: srs
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set SRS_EAM_PASSWORD}
      SRS_EAM_PASSWORDS: ${SRS_EAM_PASSWORDS:-}
      COALITION: ${COALITION:-2}
      STT_URLS: ${STT_URLS:-http://stt-worker:8082}
      TTS_URLS: ${TTS_URLS:-http://tts-worker:8083}
      BRAIN_URL: http://brain:8081
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: '8085'
      AIRFIELD_GATEWAY_POLL_SECONDS: ${AIRFIELD_GATEWAY_POLL_SECONDS:-1}
      AIRFIELD_GATEWAY_STALE_SECONDS: ${AIRFIELD_GATEWAY_STALE_SECONDS:-15}
    depends_on: [srs, brain, stt-worker, tts-worker]
    networks: [radio]
  verify:
    profiles: [verify]
    image: localhost/overlordbot-local-runtime:dev
    entrypoint: ["python", "/verify/e2e.py"]
    environment:
      SRS_EAM_PASSWORD: ${SRS_EAM_PASSWORD:?Set SRS_EAM_PASSWORD}
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - ./scripts:/verify:ro
      - ./artifacts:/artifacts:rw
      - ./fixtures/radio:/corpus:ro
    depends_on: [radio-gateway]
    networks: [radio]
networks:
  radio:
    internal: true
