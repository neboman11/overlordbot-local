name: verify-and-publish
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['DEPLOY.md', 'README.md', 'benchmarks/**', 'data/PROVENANCE.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              sys.exit("Release tags must use vMAJOR.MINOR.PATCH without leading zeroes")
          PY
      - name: Install Opus for codec regression tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0
      - run: python3 -m unittest discover -s tests -v
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: runtime
            file: Dockerfile
          - name: speech
            file: Dockerfile.speech
          - name: srs
            file: Dockerfile.srs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish linux/amd64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -eu
          image="ghcr.io/neboman11/overlordbot-local-${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 -f "$DOCKERFILE" -t "$image" .
          docker push "$image"
          docker inspect --format '{{json .RepoDigests}}' "$image" > "image-${IMAGE_NAME}.json"
          printf '%s\n' "$image" > "tag-${IMAGE_NAME}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: |
            image-*.json
            tag-*.txt
  integration:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify published images over real SRS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'image-*' --dir build-images
          for component in runtime speech srs; do
            image=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0])' "build-images/image-${component}/image-${component}.json")
            docker pull "$image"
            docker tag "$image" "localhost/overlordbot-local-${component}:dev"
          done
          SRS_EAM_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SRS_EAM_PASSWORD"
          export SRS_EAM_PASSWORD
          mkdir -p artifacts
          chmod 777 artifacts
          docker compose -f compose.yaml -f compose.verify.yaml up -d
          docker compose -f compose.yaml -f compose.verify.yaml --profile verify run --rm verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radio-verification
          path: artifacts/
  release:
    needs: integration
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Promote verified image digests to release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'image-*' --dir release-images
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in runtime speech srs; do
            source=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0])' "release-images/image-${component}/image-${component}.json")
            image="ghcr.io/neboman11/overlordbot-local-${component}:${GITHUB_REF_NAME}"
            docker buildx imagetools create --prefer-index=false --tag "$image" "$source"
            docker buildx imagetools inspect "$image"
          done
