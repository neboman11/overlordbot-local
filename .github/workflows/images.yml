name: verify-and-publish
on:
  push:
    branches: [main]
    paths-ignore: ['DEPLOY.md', 'README.md', 'benchmarks/**', 'data/PROVENANCE.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Opus for codec regression tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0
      - run: python3 -m unittest discover -s tests -v
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: runtime
            file: Dockerfile
          - name: speech
            file: Dockerfile.speech
          - name: srs
            file: Dockerfile.srs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish linux/amd64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -eu
          image="ghcr.io/neboman11/overlordbot-local-${IMAGE_NAME}:${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 -f "$DOCKERFILE" -t "$image" .
          docker push "$image"
          docker inspect --format '{{json .RepoDigests}}' "$image" > "image-${IMAGE_NAME}.json"
          printf '%s\n' "$image" > "tag-${IMAGE_NAME}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.name }}
          path: |
            image-*.json
            tag-*.txt
  integration:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify published images over real SRS
        run: |
          set -eu
          for component in runtime speech srs; do
            image="ghcr.io/neboman11/overlordbot-local-${component}:${GITHUB_SHA}"
            docker pull "$image"
            docker tag "$image" "localhost/overlordbot-local-${component}:dev"
          done
          SRS_EAM_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$SRS_EAM_PASSWORD"
          export SRS_EAM_PASSWORD
          mkdir -p artifacts
          chmod 777 artifacts
          docker compose -f compose.yaml -f compose.verify.yaml up -d
          docker compose -f compose.yaml -f compose.verify.yaml --profile verify run --rm verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radio-verification
          path: artifacts/
